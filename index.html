<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Média</title>
    <!-- Ligação com o arquivo CSS -->
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <main>
        <h1>Calculadora de Média</h1>
        <p>Informe as três notas do aluno:</p>
        <label for="nota1">Primeira nota:</label>
        <input type="number" id="nota1" min="0" max="10" step="0.1">
        <br><br>
        <label for="nota2">Segunda nota:</label>
        <input type="number" id="nota2" min="0" max="10" step="0.1">
        <br><br>
        <label for="nota3">Terceira nota:</label>
        <input type="number" id="nota3" min="0" max="10" step="0.1">
        <br><br>
        <!-- Ao clicar no botão, a função calcularMedia será executada -->
        <button onclick="calcularMedia()">Calcular Média</button>
        <!-- Local onde o JavaScript apresentará o resultado -->
        <p id="resultado">O resultado aparecerá aqui!</p>
    </main>
    <script src="script.js"></script>
</body>
